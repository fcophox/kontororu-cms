project_id = "kontororu-cms"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # el alta la controla Rukma Studio por invitación
enable_manual_linking = false

[auth.email]
# OJO: aquí `enable_signup` NO significa "permitir registro" — activa o
# desactiva el proveedor email ENTERO. Con false, ni siquiera los usuarios
# existentes pueden iniciar sesión ("Email logins are disabled").
# El bloqueo del alta self-service es el `enable_signup` de [auth], arriba.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[analytics]
enabled = false
