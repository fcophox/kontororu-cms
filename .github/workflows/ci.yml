name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Para reaplicar migraciones a mano sin tener que empujar un commit vacío
  # —por ejemplo cuando un push falló a medias y hay que reintentarlo.
  workflow_dispatch:

jobs:
  # ===================================================================
  # Job bloqueante. Ningún despliegue sale sin que esto pase en verde:
  # una fuga entre tenants es una fuga de datos de un cliente a otro.
  # ===================================================================
  rls-isolation:
    name: Aislamiento multi-tenant (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión fija a propósito. Con `latest`, el CI de un commit que no toca
      # nada puede ponerse rojo porque Supabase publicó una release esa mañana,
      # y un job bloqueante que falla por su cuenta deja de leerse: cuando salte
      # por una fuga real entre tenants, nadie lo va a distinguir del ruido.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Levantar Supabase local
        run: supabase start

      - name: Tests pgTAP (RLS, RBAC, escalada de privilegios)
        run: supabase test db

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Exportar credenciales locales
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CRON_SECRET=ci-secret"
          } >> "$GITHUB_ENV"

      - name: Build de la app
        run: npm run build

      - name: Arrancar la app
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Tests de integración (PostgREST · Storage · API headless)
        run: npm run test:integration

  quality:
    name: Lint · tipos · fugas de credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Guardia de service role key
        run: ./scripts/check-service-role-leak.sh

  # ===================================================================
  # ¿Este push trae migraciones nuevas?
  #
  # Con revisores obligatorios en el Environment, un `migrate` que arranca
  # en cada push pediría aprobación también cuando no hay nada que aplicar.
  # Una aprobación que casi siempre es "no hacía falta" se acaba dando sin
  # mirar, y entonces deja de proteger el día que sí importa.
  # ===================================================================
  migrations-changed:
    name: ¿Hay migraciones nuevas?
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A mano se lanza porque alguien quiere aplicar algo: no se discute.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual: se aplica."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Primer push de la rama, force-push o base desconocida: ante la
          # duda se sigue adelante. `db push` no hace nada si no hay nada
          # pendiente, así que equivocarse por exceso sólo cuesta un job.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Sin base con la que comparar: se aplica por si acaso."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^supabase/migrations/'; then
            echo "Migraciones tocadas en este push:"
            git diff --name-only "$BEFORE" "$AFTER" | grep '^supabase/migrations/'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ninguna migración en este push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ===================================================================
  # Migraciones de producción.
  #
  # Existe porque el despliegue de Railway sólo construye y arranca la app:
  # `railway.json` no toca Supabase, así que el esquema se actualizaba a
  # mano. Eso funciona hasta que alguien se olvida, y entonces el código
  # nuevo corre contra un esquema viejo — una columna que no existe o un
  # trigger que no está — sin ningún aviso hasta que un cliente lo nota.
  #
  # Depende de los DOS jobs anteriores. Aplicar migraciones a la base real
  # de los clientes con los tests de aislamiento en rojo es exactamente el
  # orden equivocado: primero se demuestra que el esquema nuevo no filtra
  # datos entre tenants, después se aplica.
  # ===================================================================
  migrate:
    name: Aplicar migraciones a producción
    needs: [rls-isolation, quality, migrations-changed]
    # Automático, pero sólo cuando hay algo que aplicar y sólo desde main:
    # `workflow_dispatch` se puede lanzar desde cualquier rama, y aplicar a
    # producción el esquema de una rama a medias sería un desplegable del
    # menú. La aprobación humana, si se quiere, se configura como revisores
    # del Environment `production` — no se codifica aquí.
    if: |
      needs.migrations-changed.outputs.changed == 'true'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Enlaza este job con un Environment de GitHub llamado `production`.
    # Si se le configuran revisores requeridos, cada aplicación queda a la
    # espera de una aprobación humana y se ve en el historial quién la dio.
    environment: production

    # Dos ejecuciones simultáneas se pisarían el historial de migraciones.
    # Sin cancelar la que ya corre: abortar un `db push` a medias deja el
    # esquema en un estado que nadie ha escrito.
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false

    # La CLI los lee del entorno. Puestos a nivel de job para no repetirlos
    # —y no olvidarlos— en cada paso.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      # Misma versión fija que el job de aislamiento, y por la misma razón.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Sin esto, un secret que falta se manifiesta como un error de la CLI
      # a mitad del proceso, que es más difícil de leer que decirlo aquí.
      - name: Comprobar credenciales
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_REF" ]           || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets:$missing — configúralos en Settings → Secrets → Actions."
            exit 1
          fi

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      # El estado local frente al remoto, ANTES de tocar nada. Si el push
      # sale mal, el log ya dice de dónde se partía; sin esto hay que
      # deducirlo del historial de commits.
      - name: Estado de las migraciones
        run: supabase migration list

      - name: Qué se va a aplicar
        run: supabase db push --dry-run

      - name: Aplicar
        run: supabase db push

      - name: Estado final
        run: supabase migration list
